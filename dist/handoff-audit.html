<!doctype html><html lang="ko"><meta charset="utf-8"><title>PC 화면 점검</title><style>body{font:14px system-ui;background:#f5f7fa;color:#16181d;margin:24px}button{font:inherit;padding:12px 20px}#views{display:flex;gap:24px;align-items:start;margin:24px 0}iframe{border:0;outline:1px solid #e6e9ef;flex-shrink:0;background:white}table{border-collapse:collapse;width:100%}td,th{padding:8px;text-align:left;border-bottom:1px solid #e6e9ef}pre{white-space:pre-wrap}</style><h1>PC 화면 점검</h1><button id="start">PC 화면 점검 시작</button><p id="status">준비됨</p><div id="views"><iframe id="desktop" width="1440" height="900" title="데스크톱 점검 화면"></iframe></div><table><thead><tr><th>화면</th><th>크기</th><th>내용</th><th>결과</th></tr></thead><tbody id="results"></tbody></table><pre id="summary"></pre><script type="module">
import {screens} from './handoff.js';
const results=[],status=document.querySelector('#status');
function inspect(frame,spec,size){return new Promise(resolve=>{let done=false;const finish=(error)=>{if(done)return;done=true;clearTimeout(timer);removeEventListener('message',ready);const doc=frame.contentDocument;const modal=doc?.querySelector('dialog[open]');const text=(modal||doc?.querySelector('#app'))?.innerText||'';const root=doc?.documentElement;const row={id:spec.id,name:spec.name,size,width:root?.clientWidth,scrollWidth:root?.scrollWidth,textLength:text.trim().length,dialog:!!modal,error:error||(!text.trim()?'화면 내용 없음':spec.overlay&&!modal?'모달 없음':null)};results.push(row);const tr=document.createElement('tr');for(const value of [spec.name,size+'px',row.textLength+'자',row.error||'정상']){const td=document.createElement('td');td.textContent=value;tr.append(td)}document.querySelector('#results').append(tr);resolve(row)};const ready=e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.type==='handoff-ready'&&e.data.id===spec.id)finish()};addEventListener('message',ready);const timer=setTimeout(()=>finish('화면 준비 신호 없음'),8000);frame.src='./index.html?screen='+spec.id+'&capture=full';})}
document.querySelector('#start').onclick=async e=>{e.target.disabled=true;for(const [i,spec] of screens.entries()){status.textContent=(i+1)+' / '+screens.length+' · '+spec.name;await inspect(document.querySelector('#desktop'),spec,1440)}status.textContent='완료 · '+results.length+'개 화면';document.querySelector('#summary').textContent=JSON.stringify({count:results.length,errors:results.filter(r=>r.error),overflow:results.filter(r=>r.scrollWidth>r.width)},null,2);e.target.disabled=false};
</script></html>
