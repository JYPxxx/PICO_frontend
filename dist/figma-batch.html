<!doctype html><html lang="ko"><meta charset="utf-8"><title>Figma 전체 화면 이전</title><style>body{font:14px system-ui;background:#f5f7fa;color:#16181d;margin:24px}h1{font-size:22px}iframe{display:block;border:0;background:white;margin:16px 0 32px}p{color:#4b5160}</style><h1>Figma 전체 화면 이전</h1><p id="status">준비 중</p><div id="views"></div><script type="module">
const q=new URLSearchParams(location.search),batch=q.get('batch');const all=await(await fetch('./figma-batches.json')).json(),items=all[batch]||[];
for(const item of items){const {id,width,captureId}=item;const f=document.createElement('iframe');f.title=id+' · '+width;f.width=width;f.height=width===390?844:900;const ep='https://mcp.figma.com/mcp/capture/'+captureId+'/submit?bindVariables=true';f.src='./index.html?screen='+id+'&capture=full#figmacapture='+captureId+'&figmaendpoint='+encodeURIComponent(ep)+'&figmadelay=1500';document.querySelector('#views').append(f)}document.querySelector('#status').textContent=items.length+'개 화면 이전 중 · '+items.map(x=>x.id+' '+x.width).join(' / ');
</script></html>
